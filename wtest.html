<!DOCTYPE html><html><head><meta charset="utf-8"><style>
.box{width:360px;height:200px;border:1px solid #ccc;margin:8px;display:inline-block;vertical-align:top}
.lbl{font:14px sans-serif;padding:4px}
</style></head><body>
<div class="lbl">A: symbol-overview SP:SPX</div>
<div class="box" id="a"></div>
<div class="lbl">B: advanced-chart SP:SPX</div>
<div class="box" id="b"></div>
<div class="lbl">C: mini TVC:SPX</div>
<div class="box" id="c"></div>
<div class="lbl">D: symbol-overview TVC:NI225</div>
<div class="box" id="d"></div>
<script>
function add(elId, src, cfg){
  const el=document.getElementById(elId);
  const wrap=document.createElement('div');wrap.className='tradingview-widget-container';wrap.style.height='100%';
  const w=document.createElement('div');w.className='tradingview-widget-container__widget';w.style.height='100%';wrap.appendChild(w);
  const s=document.createElement('script');s.async=true;s.src=src;s.textContent=JSON.stringify(cfg);wrap.appendChild(s);
  el.appendChild(wrap);
}
add('a','https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js',{symbols:[["SP:SPX|1D"]],chartOnly:false,width:"100%",height:"100%",locale:"zh_TW",colorTheme:"light",isTransparent:true,autosize:true});
add('b','https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js',{symbol:"SP:SPX",width:"100%",height:"100%",locale:"zh_TW",interval:"D",theme:"light",style:"3",hide_top_toolbar:true,hide_legend:false,allow_symbol_change:false});
add('c','https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js',{symbol:"TVC:SPX",width:"100%",height:"100%",locale:"zh_TW",dateRange:"1D",colorTheme:"light",isTransparent:true,autosize:true});
add('d','https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js',{symbols:[["TVC:NI225|1D"]],chartOnly:false,width:"100%",height:"100%",locale:"zh_TW",colorTheme:"light",isTransparent:true,autosize:true});
</script>
</body></html>
