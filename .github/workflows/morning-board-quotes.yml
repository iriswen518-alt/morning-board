name: Morning Board — quotes (numbers)
on:
  schedule:
    - cron: '0 0-15,22,23 * * *'   # hourly 08:00-23:00 + 06:00,07:00 Asia/Taipei (cron is UTC)
    # 收盤後密集補打:TW 13:30 收盤(05:30 UTC)、~13:35 落定終值。GitHub 排程是 best-effort、
    # 高負載時常跳過或延遲,所以在收盤後窗口(13:40–16:45 Taipei = 05:40–08:45 UTC)多排幾次,
    # 只要有一次真的跑到就會抓到當日終值;anti-regression 守門(refresh_taiex.py)會把它黏住。
    - cron: '40,55 5 * * *'        # 13:40, 13:55 Taipei
    - cron: '15,30,45 6 * * *'     # 14:15, 14:30, 14:45 Taipei
    - cron: '15,30,45 7 * * *'     # 15:15, 15:30, 15:45 Taipei
    - cron: '15,45 8 * * *'        # 16:15, 16:45 Taipei
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: morning-board-quotes
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet requests
      - name: Prepare working layout
        run: |
          mkdir -p ~/scripts/logs work
          cp build/*.py work/
          ln -sfn "$GITHUB_WORKSPACE" work/repo
      - name: Fetch numbers
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          cd work
          python3 fetch_market_data.py
          python3 build_market_json.py
          python3 refresh_taiex.py
          python3 fetch_stocks.py
          python3 fetch_popular_stocks.py
          python3 fetch_tpex_quotes.py
      - name: Gate
        run: cd work && python3 validate_quotes.py
      - name: Validate data contract
        # 形狀守門：fetch 寫到 data/（經 work/repo 連結），故從 repo 根跑驗證器。
        # 任何缺欄／型別錯／空陣列即 fail，擋下「壞掉的 JSON 被 push」。見 specs/DATA_CONTRACT.md
        run: python3 build/validate_contract.py --strict
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/stocks.json data/tpex_quotes.json data/popular_stocks.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          # numbers changed → stamp the cloud refresh time (Taipei) so 上次更新 advances even with the Mac off.
          # written only here (single-writer for this file); frontend shows max(meta.built_at, this).
          printf '{"built_at": "%s"}\n' "$(TZ=Asia/Taipei date '+%Y-%m-%dT%H:%M:%S+08:00')" > data/quotes_built_at.json
          git add data/quotes_built_at.json
          git commit -m "data(actions): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
