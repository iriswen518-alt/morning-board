<!DOCTYPE html><html><head><meta charset="utf-8"><style>
.box{width:360px;height:240px;border:1px solid #ccc;margin:8px;display:inline-block;vertical-align:top}
.lbl{font:14px sans-serif;padding:4px}</style></head><body>
<div class="lbl">B2: advanced-chart SP:SPX</div><div class="box" id="b"></div>
<div class="lbl">E: symbol-overview AMEX:SPY (ETF)</div><div class="box" id="e"></div>
<div class="lbl">F: mini AMEX:SPY (ETF)</div><div class="box" id="f"></div>
<div class="lbl">G: mini TWSE:2330 (台積電個股)</div><div class="box" id="g"></div>
<script>
function add(elId, src, cfg){const el=document.getElementById(elId);const wrap=document.createElement('div');wrap.className='tradingview-widget-container';wrap.style.height='100%';const w=document.createElement('div');w.className='tradingview-widget-container__widget';w.style.height='100%';wrap.appendChild(w);const s=document.createElement('script');s.async=true;s.src=src;s.textContent=JSON.stringify(cfg);wrap.appendChild(s);el.appendChild(wrap);}
add('b','https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js',{symbol:"SP:SPX",width:"100%",height:"100%",locale:"zh_TW",interval:"D",theme:"light",style:"3",hide_top_toolbar:true,allow_symbol_change:false});
add('e','https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js',{symbols:[["AMEX:SPY|1D"]],width:"100%",height:"100%",locale:"zh_TW",colorTheme:"light",isTransparent:true,autosize:true});
add('f','https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js',{symbol:"AMEX:SPY",width:"100%",height:"100%",locale:"zh_TW",dateRange:"1D",colorTheme:"light",isTransparent:true,autosize:true});
add('g','https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js',{symbol:"TWSE:2330",width:"100%",height:"100%",locale:"zh_TW",dateRange:"1D",colorTheme:"light",isTransparent:true,autosize:true});
</script></body></html>
