<!-- 網頁版底部筆記列（2026-11-07）：Enter 直接寫入 vault 00市場日誌，走本機 127.0.0.1:8878 /market；手機不顯示 -->
<section class="mb-note" id="mb-note" aria-label="市場日誌筆記">
  <textarea id="mb-note-text" rows="2" placeholder="市場日誌：輸入後按 Enter 直接存"></textarea>
  <span class="mb-note-hint" id="mb-note-hint">市場日誌</span>
</section>
<style>
.mb-note{display:none}
@media (min-width:769px){
  .mb-note{display:flex;align-items:center;gap:12px;max-width:760px;margin:12px auto 0;padding:8px 12px;
    background:var(--card-bg);border:1px solid var(--border);border-radius:10px}
  .mb-note textarea{flex:1;resize:none;border:0;outline:0;background:transparent;font:inherit;font-size:15px;
    line-height:1.5;color:var(--text,#1f2937);min-height:46px;max-height:46px;padding:0}
  .mb-note textarea::placeholder{color:var(--text-mute,#77839a)}
  .mb-note-hint{flex:0 0 auto;font-size:12px;color:var(--text-mute,#77839a);min-width:4em;text-align:right}
  .mb-note-hint.ok{color:var(--brand-primary,#3A568C)}.mb-note-hint.err{color:var(--up,#d62828)}
}
</style>
<script>
(function(){
  var ta=document.getElementById("mb-note-text"),hint=document.getElementById("mb-note-hint");
  if(!ta)return;
  var KEY="mb_note_pending_v1";
  function say(t,c){hint.textContent=t;hint.className="mb-note-hint"+(c?" "+c:"");}
  function send(text){
    return fetch("http://127.0.0.1:8878/market",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text})})
      .then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||"fail");return j;});
  }
  // Safari 擋 https→http://127.0.0.1（mixed content）：改走 obsidian://new 直接在 vault 建檔（同 FloatNote 格式）
  function topicOf(text){
    var lines=text.split("\n");for(var i=0;i<lines.length;i++){var l=lines[i].trim().replace(/^[#\-• ]+/,"").trim();
      if(l)return l.replace(/[\/\\:*?"<>|]/g,"·").replace(/\s+/g," ").slice(0,60);}return "未命名";}
  function viaObsidian(text){
    var d=new Date(),pad=function(n){return(n<10?"0":"")+n;},ymd=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()),iso=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
    var topic=topicOf(text),file="00卡片筆記/00市場日誌/市場日誌_"+ymd+"_"+topic;
    var content="---\ndate: "+iso+"\ntype: 市場日誌\ntopic: "+topic+"\nsource: 理財小幫手\n---\n\n# "+topic+"\n\n"+text+"\n";
    location.href="obsidian://new?vault=obsidian&file="+encodeURIComponent(file)+"&content="+encodeURIComponent(content);
  }
  function flush(){ // 伺服器未啟動時暫存，之後再補送
    var q;try{q=JSON.parse(localStorage.getItem(KEY)||"[]");}catch(_){q=[];}
    if(!q.length)return;
    send(q[0]).then(function(){q.shift();localStorage.setItem(KEY,JSON.stringify(q));flush();}).catch(function(){});
  }
  ta.addEventListener("keydown",function(e){
    if(e.key!=="Enter"||e.shiftKey||e.isComposing)return;
    e.preventDefault();
    var text=ta.value.trim();if(!text)return;
    say("寫入中…");
    send(text).then(function(j){ta.value="";say("已寫入","ok");flush();})
      .catch(function(){
        if(location.protocol==="https:"&&/Safari/.test(navigator.userAgent)&&!/Chrome|Chromium|Edg/.test(navigator.userAgent)){
          viaObsidian(text);ta.value="";say("已交給 Obsidian 建檔","ok");return;}
        var q;try{q=JSON.parse(localStorage.getItem(KEY)||"[]");}catch(_){q=[];}
        q.push(text);try{localStorage.setItem(KEY,JSON.stringify(q));}catch(_){}
        ta.value="";say("伺服器未啟動，已暫存","err");});
  });
  flush();
})();
</script>
