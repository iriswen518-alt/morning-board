<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#019AB3">
<title>晨間綜覽</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=20260509-1300">
</head>
<body>

<header class="topbar">
  <h1>🌅 晨間綜覽</h1>
  <p class="updated" id="updated">載入中…</p>
</header>

<main id="cards">
  <article class="card" data-section="market">
    <header>
      <h2>🌐 全球股市</h2>
      <span class="card-date" id="market-date"></span>
    </header>
    <div class="preview" id="market-preview">載入中…</div>
    <button class="expand-btn" data-target="market">點此展開全部指數 ▾</button>
  </article>

  <article class="card" data-section="news">
    <header>
      <h2>📰 重要新聞</h2>
      <span class="card-date" id="news-date"></span>
    </header>
    <div class="preview" id="news-preview">載入中…</div>
    <button class="expand-btn" data-target="news">點此看全部 ▾</button>
  </article>

  <article class="card" data-section="funds">
    <header>
      <h2>💼 推薦基金</h2>
      <span class="card-date" id="funds-date"></span>
    </header>
    <div class="preview" id="funds-preview">載入中…</div>
    <button class="expand-btn" data-target="funds">點此看全部 10 檔 ▾</button>
  </article>
</main>

<div class="sheet-mask" id="mask" hidden></div>
<aside class="sheet" id="sheet" hidden>
  <header class="sheet-head">
    <button class="back-btn" id="back">←</button>
    <h2 id="sheet-title"></h2>
  </header>
  <div class="sheet-body" id="sheet-body"></div>
</aside>

<script src="app.js?v=20260509-1300"></script>
</body>
</html>
